name: Summarize test results
description: Sums JUnit XML test-result attributes under build/test-results/test/*.xml and appends a table to $GITHUB_STEP_SUMMARY.

runs:
  using: composite
  steps:
    - name: summarize test results
      shell: bash
      run: |
        total=0
        failed=0
        errors=0
        skipped=0
        malformed=0
        shopt -s nullglob
        for f in build/test-results/test/*.xml; do
          t=$(sed -n 's/.*tests="\([0-9]*\)".*/\1/p' "$f" | head -1)
          fl=$(sed -n 's/.*failures="\([0-9]*\)".*/\1/p' "$f" | head -1)
          er=$(sed -n 's/.*errors="\([0-9]*\)".*/\1/p' "$f" | head -1)
          sk=$(sed -n 's/.*skipped="\([0-9]*\)".*/\1/p' "$f" | head -1)
          if [[ -z "$t" || -z "$fl" || -z "$er" || -z "$sk" ]]; then
            malformed=$((malformed + 1))
            echo "::warning file=$f::could not parse JUnit XML attributes from $f; excluded from totals"
            continue
          fi
          total=$((total + t))
          failed=$((failed + fl))
          errors=$((errors + er))
          skipped=$((skipped + sk))
        done
        passed=$((total - failed - errors - skipped))
        {
          echo "### Unit test results"
          echo ""
          echo "| Total | Passed | Failed | Errors | Skipped |"
          echo "|---|---|---|---|---|"
          echo "| $total | $passed | $failed | $errors | $skipped |"
          if [[ "$malformed" -gt 0 ]]; then
            echo ""
            echo "⚠️ $malformed report file(s) could not be parsed and were excluded from the totals above."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
